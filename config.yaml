inputs:
  context_seqs: "ingest/results/context_seqs.fasta"
  context_meta: "ingest/results/context_metadata.tsv"
  focal_seqs: "ingest/results/final_focal_seqs.fasta"
  focal_meta: "ingest/results/final_focal_metadata.tsv"
  reference: "phylogenetic/refs/CHKV.gb"
  colors: "phylogenetic/defaults/colors.tsv"
  lat_longs: "phylogenetic/defaults/lat_long.tsv"
  auspice_config: "phylogenetic/defaults/auspice_config.json"

filtering:
  min_length: 10000
  south_america:
    query: "region!='South America' host!='Homo sapiens' lineage!='East-Central-South-African'"
    group_by: "country year month"
    seqs_per_group: 1
  kenya:
    query: "country!='Kenya' host!='Homo sapiens' lineage!='East-Central-South-African'"
    group_by: "country year month"
    seqs_per_group: 10
    min_length: 8000
  global:
    query: "region='South America' country='Kenya' host!='Homo sapiens' lineage!='East-Central-South-African'"
    group_by: "country year month"
    seqs_per_group: 3

refine:
  # Fallback only — clock_check derives the real rate from this repo's own data each run.
  clock_rate_fallback: 0.0003437
  clock_std_dev: 0.0001
  root: "best"

build:
  name: "ecsa_iol_chikv"
  title: "Chikungunya virus in northeastern and coastal Kenya, 2024-2026"
  maintainers: "Gathii"
  url: "https://github.com/Gathii/CHIKV_KY_build"
